name: HackRadar — Scrape & Notify

on:
  schedule:
    # Run every 12 hours (midnight and noon UTC)
    - cron: "0 0,12 * * *"
  workflow_dispatch:   # Allow manual runs from the GitHub UI

jobs:
  run:
    name: Scrape → Filter → Notify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restore the SQLite DB from the previous run so we don't lose
      # seen / snoozed / dismissed state between GitHub Actions runs.
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: hackradar.db
          key: hackradar-db-${{ github.run_number }}
          restore-keys: |
            hackradar-db-

      - name: Run HackRadar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: python main.py

      # Save the updated DB so the next run can read it
      - name: Save database cache
        uses: actions/cache@v4
        if: always()
        with:
          path: hackradar.db
          key: hackradar-db-${{ github.run_number }}
